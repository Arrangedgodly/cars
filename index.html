<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/carsdb.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/src/index.css" rel="stylesheet" />
    <title>CarsDB</title>
    <script>
      (function () {
        var character = localStorage.getItem("carsdb-character") || "circuitred";
        var mode = localStorage.getItem("carsdb-mode") || "dark";
        document.documentElement.setAttribute("data-theme", character + "-" + mode);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
